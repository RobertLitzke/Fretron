<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#03060F"/>
  <!-- a slice of neck: three frets, four strings, one lit note and one target -->
  <g stroke="#1C4A58" stroke-width="2">
    <line x1="36" y1="26" x2="36" y2="102"/>
    <line x1="64" y1="26" x2="64" y2="102"/>
    <line x1="92" y1="26" x2="92" y2="102"/>
  </g>
  <g stroke="#6FE9FF" stroke-linecap="round">
    <line x1="14" y1="34" x2="114" y2="34" stroke-width="1.5"/>
    <line x1="14" y1="54" x2="114" y2="54" stroke-width="2"/>
    <line x1="14" y1="74" x2="114" y2="74" stroke-width="3"/>
    <line x1="14" y1="94" x2="114" y2="94" stroke-width="4"/>
  </g>
  <circle cx="50" cy="74" r="11" fill="#03060F" stroke="#6FE9FF" stroke-width="4"/>
  <circle cx="78" cy="54" r="11" fill="#FF7A1A"/>
</svg>
